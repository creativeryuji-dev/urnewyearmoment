<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soora New Year Photobox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>:root{--o:#EC6A2D;--c:#F6EBDD;--bg:#0a0a0a;--sf:#17140f;--ln:#2c2620}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--c);font:15px/1.45 'DM Sans',system-ui,sans-serif}.w{max-width:480px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}header img{height:42px}
h1{font:700 28px/1.1 Fredoka,sans-serif;margin:6px 0 4px}h1 b{color:var(--o)}p{margin:4px 0;color:#cdbfae}
canvas{width:100%;height:auto;border-radius:14px;border:1px solid var(--ln);touch-action:none;display:block;margin-top:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:14px}.card h2{font:600 17px Fredoka,sans-serif;margin:0 0 8px}
label{display:block;font-size:12px;color:#b9aa98;margin:10px 0 4px}input,textarea,select{width:100%;background:#0f0d0a;color:var(--c);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit}
input[type=range]{padding:0;accent-color:var(--o)}input[type=checkbox]{width:auto;margin-right:8px}
button{font:600 15px Fredoka,sans-serif;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:#2a241c;color:var(--c)}button.p{background:var(--o);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.lay button.on{background:var(--c);color:#111}
.ch{font:500 12px 'DM Sans',sans-serif;padding:6px 10px;border-radius:99px;background:#241e16;border:1px solid var(--ln);flex:0 0 auto}small,.mu{color:#8f8272;font-size:12px}
button:disabled{opacity:.45;cursor:default}
#cam{position:fixed;inset:0;z-index:50;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}#cam[hidden]{display:none}
.cbar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center}.cbar b{font:600 18px Fredoka,sans-serif}.cbar button{padding:8px 14px}
#cvw{--ar:1.2;position:relative;margin:auto 0;width:min(92vw,calc(52vh * var(--ar)),480px);aspect-ratio:var(--ar);overflow:hidden;background:#000;outline:4px solid var(--o);outline-offset:3px}
#cvw.rrect{border-radius:21%/25%}#cvw.sq{border-radius:0}
#vid{width:100%;height:100%;object-fit:cover;display:block}#vid.mir{transform:scaleX(-1)}
#cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 130px Fredoka,sans-serif;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.65)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
#cmsg{text-align:center;color:#cdbfae;min-height:42px;margin:12px 0 8px;max-width:480px;font-size:14px}
.ccr{width:100%;max-width:480px}</style></head><body><div class="w">
<header><img src="logos/soora-cream.png" alt="Soora Sushi Club"></header>
<h1>Happy New Year <b>2027</b></h1><p>Make your New Year photo strip with Soora. Your photos are never uploaded to a server, everything stays on your device.</p>
<canvas id="cv" width="1200" height="1800"></canvas><p class="mu">Tap a frame to take a photo. Drag a photo to adjust its position. Each photo appears on both strips.</p>
<div class="card"><h2>1. Choose your strip</h2><div class="row lay" id="lay"></div><div class="row" style="margin-top:10px;align-items:center"><label style="display:flex;align-items:center;margin:0;color:var(--c);font-size:14px"><input type="checkbox" id="bw" onchange="draw()">Black &amp; white</label></div></div>
<div class="card"><h2>2. Photos</h2><button class="p" id="bCam" style="width:100%">📷 Start camera session (3 photos)</button><div class="row" style="margin-top:8px"><button id="bRe">Retake this frame</button><button id="bAdd">Upload</button><button id="bRm">Remove</button></div>
<label>Zoom selected photo</label><input type="range" id="zm" min="1" max="3" step="0.05" value="1"><small id="st"></small><input type="file" id="fi" accept="image/*" multiple hidden></div>
<div class="card"><h2>3. Wish &amp; name</h2><label>Name</label><input id="nm" maxlength="24" placeholder="Your name">
<label>Your New Year wish</label><textarea id="ws" rows="3" maxlength="120" placeholder="May the new year be full of laughter, luck, and sushi!"></textarea><div class="row" id="ch" style="margin-top:8px"></div>
<label>Outlet (optional)</label><select id="ol" onchange="draw()"><option value="">-</option><option>Fujiyama</option><option>Tugu</option><option>Bekasi</option><option>Surabaya</option></select>
<label style="display:flex;align-items:flex-start;margin-top:12px"><input type="checkbox" id="op">Allow Soora to save my name &amp; wish for campaigns (photos are never saved).</label></div>
<div class="row" style="margin-top:14px"><button class="p" id="bDl">⬇ Print 4×6</button><button id="bSt">⬇ Story</button><button id="bSh">Share</button></div></div>
<div id="cam" hidden>
  <div class="cbar"><b id="ctitle">Camera</b><button id="cClose">Close</button></div>
  <div id="cvw"><video id="vid" playsinline muted autoplay></video><div id="cnt"></div><div id="flash"></div></div>
  <div id="cmsg"></div>
  <div class="row ccr" style="margin-bottom:10px"><button class="ch" id="cMir">Mirror: on</button><button class="ch" id="cFlip">Switch camera</button></div>
  <button class="p ccr" id="cGo" disabled>Start</button>
</div>
<script>
// ---------- Config ----------
const W = 1080, H = 1920;                 // frame files are 1080x1920 (story size)
const PANEL = { x: 94, y: 289, w: 892, h: 1342 };   // the 2-strip panel inside the frame = 4x6 print area
const PW = 1200, PH = 1800;               // print output 4x6 inch @300dpi
const ORANGE = '#EC6A2D', OLIVE = '#414128', CREAM = '#FFEBB9';

// Each frame has 2 strips side by side, 3 photo holes each (transparent in the PNG).
// cols = x of the left/right hole, ys = y of the 3 rows, w/h = hole size (in 1080x1920 pixels).
// The same 3 photos are shown on both strips. If you replace a frame with a 2x version of the same design, these numbers still apply.
const FRAMES = {
  cream:  { label: 'Happy New Year', src: 'assets/frame-cream.png',  shape: 'rrect', r: 75, hl: ORANGE,
            cols: [136, 582], ys: [421, 748, 1075], w: 361, h: 298, cap: OLIVE, stroke: null, nameCol: ORANGE },
  orange: { label: 'Flight ticket',  src: 'assets/frame-orange.png', shape: 'rect',  r: 0,  hl: ORANGE,
            cols: [117, 563], ys: [509, 827, 1145], w: 398, h: 300, cap: CREAM, stroke: OLIVE, nameCol: CREAM }
};
const WISH = ['Here\'s to 2027 full of laughter and sushi!','More gatherings, more stories.','Health, happiness, and good fortune.','Cheers to new moments, new bites!'];
const DEFAULT_WISH = 'May the new year be full of laughter, luck, and sushi!';

// ---------- State ----------
const $ = id => document.getElementById(id), cv = $('cv');
let X = cv.getContext('2d');
let lay = 'cream', slots = [null, null, null], sel = 0, FI = {}, drag = null;

const loadImg = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
// the 2 holes (left strip, right strip) of row i
const holes = i => { const f = FRAMES[lay]; return f.cols.map(x => [x, f.ys[i], f.w, f.h]); };

// ---------- Drawing ----------
function rr(x, y, w, h, r) {
  X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r);
  X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath();
}
function holePath(r) { const [x, y, w, h] = r; rr(x, y, w, h, FRAMES[lay].r); }
function star(cx, cy, r) {
  X.save(); X.strokeStyle = ORANGE; X.lineWidth = r / 4; X.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 4, dx = Math.cos(a) * r, dy = Math.sin(a) * r;
    X.beginPath(); X.moveTo(cx - dx, cy - dy); X.lineTo(cx + dx, cy + dy); X.stroke();
  }
  X.restore();
}
function text(t, x, y, font, color, stroke) {
  X.font = font; X.textAlign = 'center';
  if (stroke) { X.lineJoin = 'round'; X.lineWidth = 7; X.strokeStyle = stroke; X.strokeText(t, x, y); }
  X.fillStyle = color; X.fillText(t, x, y);
}
function wrap(t, maxW) {
  const lines = []; let cur = '';
  for (const s of t.split(/\s+/)) {
    const n = cur ? cur + ' ' + s : s;
    if (X.measureText(n).width > maxW && cur) { lines.push(cur); cur = s; } else cur = n;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawCell(r, s, mode) {
  const [x, y, w, h] = r;
  X.save(); X.beginPath(); X.rect(x, y, w, h); X.clip();
  if (s) {
    const k = Math.max(w / s.img.width, h / s.img.height) * s.z, dw = s.img.width * k, dh = s.img.height * k;
    X.drawImage(s.img, x + (w - dw) / 2 + s.ox * (dw - w) / 2, y + (h - dh) / 2 + s.oy * (dh - h) / 2, dw, dh);
    if ($('bw').checked) {
      X.globalCompositeOperation = 'saturation'; X.fillStyle = '#000'; X.fillRect(x, y, w, h);
      X.globalCompositeOperation = 'source-over';
    }
  } else {
    X.fillStyle = mode === 'preview' ? '#FFFFFF' : '#EFE8DC'; X.fillRect(x, y, w, h);
    star(x + w / 2, y + h / 2 - (mode === 'preview' ? 12 : 0), Math.min(w, h) / 9);
    if (mode === 'preview') text('Tap to take a photo', x + w / 2, y + h / 2 + 46, '500 20px "DM Sans",sans-serif', '#8f8272');
  }
  X.restore();
}

// name printed next to the "NAME" label on the ticket stub (right strip, flight frame only)
function ticketName() {
  const nm = $('nm').value.trim().toUpperCase(); if (!nm || lay !== 'orange') return;
  let fs = 10; X.save(); X.textAlign = 'left'; X.fillStyle = OLIVE;
  for (; fs >= 6; fs--) { X.font = '700 ' + fs + 'px "Courier New",monospace'; if (X.measureText(nm).width <= 132) break; }
  X.fillText(nm, 793, 341); X.restore();
}

// wish + name under the panel (story / preview only, there is no room inside the 4x6 print)
function drawCaption() {
  const f = FRAMES[lay], nm = $('nm').value.trim().slice(0, 24), outlet = $('ol').value;
  const ws = ($('ws').value.trim() || DEFAULT_WISH).slice(0, 120), cx = W / 2;
  let fs = 28, lines;
  for (; fs >= 16; fs--) { X.font = 'italic 500 ' + fs + 'px "DM Sans",sans-serif'; lines = wrap(ws, 860); if (lines.length <= 2) break; }
  const lh = Math.round(fs * 1.22); let y = 1822;
  lines.slice(0, 2).forEach(t => { text(t, cx, y, 'italic 500 ' + fs + 'px "DM Sans",sans-serif', f.cap, f.stroke); y += lh; });
  const who = [nm, outlet ? 'Soora Sushi Club ' + outlet : ''].filter(Boolean).join(' · ');
  if (who) text(who, cx, y + 12, '600 26px Fredoka,sans-serif', f.nameCol, f.stroke);
}

// mode: 'preview' (on screen), 'story' (1080x1920 export), 'print' (4x6 export, called with a transform + clip)
function render(ctx, mode) {
  const prev = X; X = ctx;
  try {
    const f = FRAMES[lay], fimg = FI[lay];
    X.clearRect(0, 0, W, H); X.fillStyle = lay === 'cream' ? '#FFEBB9' : ORANGE; X.fillRect(0, 0, W, H);
    for (let i = 0; i < 3; i++) holes(i).forEach(r => drawCell(r, slots[i], mode));
    if (fimg) X.drawImage(fimg, 0, 0, W, H);
    ticketName();
    if (mode === 'preview') {
      X.save(); X.lineWidth = 6; X.strokeStyle = f.hl;
      holes(sel).forEach(r => { holePath(r); X.stroke(); }); X.restore();
    }
    if (mode !== 'print') drawCaption();
  } finally { X = prev; }
}
function draw() { render(cv.getContext('2d'), 'preview'); }

// ---------- UI ----------
function setLay(k) { lay = k; draw(); ui(); }
function ui() {
  $('lay').innerHTML = Object.keys(FRAMES).map(k => `<button class="${k === lay ? 'on' : ''}" onclick="setLay('${k}')">${FRAMES[k].label}</button>`).join('');
  const s = slots[sel];
  $('zm').value = s ? s.z : 1; $('zm').disabled = !s; $('bRm').disabled = !s;
  $('st').textContent = 'Selected frame: ' + (sel + 1) + (s ? '' : ' (empty)');
}
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function hit(px, py) {
  for (let i = 0; i < 3; i++) if (holes(i).some(r => px >= r[0] && px <= r[0] + r[2] && py >= r[1] && py <= r[1] + r[3])) return i;
  return -1;
}
cv.onpointerdown = e => {
  const [px, py] = pos(e), i = hit(px, py); if (i < 0) return;
  sel = i; const s = slots[i];
  drag = { i, px, py, ox: s ? s.ox : 0, oy: s ? s.oy : 0, m: 0 };
  cv.setPointerCapture(e.pointerId); draw(); ui();
};
cv.onpointermove = e => {
  if (!drag) return; const s = slots[drag.i]; if (!s) return;
  const [px, py] = pos(e), [, , w, h] = holes(drag.i)[0];
  const k = Math.max(w / s.img.width, h / s.img.height) * s.z, ex = (s.img.width * k - w) / 2, ey = (s.img.height * k - h) / 2;
  drag.m = Math.max(drag.m, Math.hypot(px - drag.px, py - drag.py));
  if (ex > 1) s.ox = Math.max(-1, Math.min(1, drag.ox + (px - drag.px) / ex));
  if (ey > 1) s.oy = Math.max(-1, Math.min(1, drag.oy + (py - drag.py) / ey));
  draw();
};
cv.onpointerup = () => { if (drag && drag.m < 10 && !slots[drag.i]) (camOK ? openCam([drag.i]) : pickFile()); drag = null; };

const fi = $('fi'), pickFile = () => { fi.value = ''; fi.click(); };
$('bAdd').onclick = pickFile;
$('bCam').onclick = () => camOK ? openCam([0, 1, 2]) : pickFile();
$('bRe').onclick = () => camOK ? openCam([sel]) : pickFile();
$('bRm').onclick = () => { slots[sel] = null; draw(); ui(); };
$('zm').oninput = e => { if (slots[sel]) { slots[sel].z = +e.target.value; draw(); } };
const loadFile = f => createImageBitmap(f).catch(() => loadImg(URL.createObjectURL(f)));
const put = async (f, j) => { const b = await loadFile(f); if (b) slots[j] = { img: b, z: 1, ox: 0, oy: 0 }; };
fi.onchange = async () => {
  const fs = [...fi.files]; if (!fs.length) return;
  await put(fs[0], sel); let j = sel;
  for (const f of fs.slice(1)) {
    let t = -1;
    for (let k = 1; k <= slots.length; k++) { const c = (j + k) % slots.length; if (!slots[c]) { t = c; break; } }
    if (t < 0) break; await put(f, t); j = t;
  }
  draw(); ui();
};
['nm', 'ws'].forEach(i => $(i).oninput = () => draw());
$('ch').innerHTML = WISH.map((w, i) => `<button class="ch" onclick="$('ws').value=WISH[${i}];draw()">${w}</button>`).join('');

// ---------- Camera (photobooth) ----------
const camOK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
const vid = $('vid'), sleep = ms => new Promise(r => setTimeout(r, ms));
let stream = null, facing = 'user', mirror = true, camTargets = [], sess = 0;

function stopStream() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } vid.srcObject = null; }
function applyMirror() { vid.classList.toggle('mir', mirror); $('cMir').textContent = 'Mirror: ' + (mirror ? 'on' : 'off'); }
function camMsg(t) { $('cmsg').textContent = t; }

async function startStream() {
  stopStream(); $('cGo').disabled = true; camMsg('Opening camera...');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    vid.srcObject = stream; await vid.play().catch(() => {});
    mirror = facing === 'user'; applyMirror();
    camMsg(camTargets.length > 1 ? 'Ready? Press Start and the camera will take ' + camTargets.length + ' photos automatically.' : 'Get in position, then press Take photo.');
    $('cGo').disabled = false;
  } catch (e) {
    camMsg('Cannot access the camera. Allow camera access in your browser, or close this and use Upload. If you opened this link inside Instagram or WhatsApp, open it in Chrome or Safari instead.');
  }
}

function openCam(targets) {
  camTargets = targets; sess++;
  const { w, h, shape } = FRAMES[lay];
  $('cvw').style.setProperty('--ar', (w / h).toFixed(3));
  $('cvw').className = shape === 'rect' ? 'sq' : 'rrect';
  $('ctitle').textContent = targets.length > 1 ? 'Camera session' : 'Photo for frame ' + (targets[0] + 1);
  $('cGo').textContent = targets.length > 1 ? 'Start session (' + targets.length + ' photos)' : 'Take photo';
  $('cnt').textContent = ''; $('cam').hidden = false; document.body.style.overflow = 'hidden';
  startStream();
}
function closeCam() { sess++; stopStream(); $('cam').hidden = true; document.body.style.overflow = ''; $('cGo').disabled = false; }

function snap() {
  const vw = vid.videoWidth, vh = vid.videoHeight; if (!vw || !vh) return null;
  const sc = Math.min(1, 1920 / Math.max(vw, vh)), c = document.createElement('canvas');
  c.width = Math.round(vw * sc); c.height = Math.round(vh * sc);
  const g = c.getContext('2d');
  if (mirror) { g.translate(c.width, 0); g.scale(-1, 1); }
  g.drawImage(vid, 0, 0, c.width, c.height);
  return c;
}

async function runSession() {
  const my = ++sess, n = camTargets.length; $('cGo').disabled = true;
  for (let i = 0; i < n; i++) {
    if (n > 1) camMsg('Photo ' + (i + 1) + ' of ' + n); else camMsg('Get ready...');
    for (let c = 3; c >= 1; c--) { $('cnt').textContent = c; await sleep(1000); if (my !== sess) return; }
    $('cnt').textContent = '';
    const img = snap();
    if (img) { slots[camTargets[i]] = { img, z: 1, ox: 0, oy: 0 }; sel = camTargets[i]; draw(); ui(); }
    $('flash').style.transition = 'none'; $('flash').style.opacity = 1; await sleep(60);
    $('flash').style.transition = 'opacity .4s'; $('flash').style.opacity = 0;
    await sleep(800); if (my !== sess) return;
  }
  camMsg('Done!'); await sleep(600); if (my === sess) closeCam();
}
$('cGo').onclick = runSession;
$('cClose').onclick = closeCam;
$('cMir').onclick = () => { mirror = !mirror; applyMirror(); };
$('cFlip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startStream(); };
window.addEventListener('pagehide', stopStream);

// ---------- Export ----------
function makeCanvas(kind) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  if (kind === 'story') { c.width = W; c.height = H; render(g, 'story'); }
  else {   // print: crop the 2-strip panel and scale it to 1200x1800
    c.width = PW; c.height = PH;
    const sx = PW / PANEL.w, sy = PH / PANEL.h;
    g.setTransform(sx, 0, 0, sy, -PANEL.x * sx, -PANEL.y * sy);
    g.beginPath(); g.rect(PANEL.x, PANEL.y, PANEL.w, PANEL.h); g.clip();
    render(g, 'print');
  }
  return c;
}
async function png(kind) {
  if (!slots.some(Boolean)) { alert('Please add at least 1 photo first.'); return null; }
  const b = await new Promise(r => makeCanvas(kind).toBlob(r, 'image/png'));
  saveWish(); return b;
}
const fname = kind => 'soora-newyear-' + (($('nm').value.trim().replace(/[^\w]+/g, '-').toLowerCase()) || 'photobooth') + (kind === 'story' ? '-story' : '-print') + '.png';
const save = (b, kind) => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = fname(kind); a.click(); };
$('bDl').onclick = async () => { const b = await png('print'); if (b) save(b, 'print'); };
$('bSt').onclick = async () => { const b = await png('story'); if (b) save(b, 'story'); };
$('bSh').onclick = async () => {
  const b = await png('story'); if (!b) return;
  const f = new File([b], fname('story'), { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f], title: 'Soora New Year 2027' }).catch(() => {});
  else save(b, 'story');
};

// ---------- Save wish (optional, requires consent checkbox) ----------
async function saveWish() {
  try {
    if (!$('op').checked) return;
    const nm = $('nm').value.trim(), ws = $('ws').value.trim(); if (!nm && !ws) return;
    const cfg = (await import('./firebase-config.js')).default;
    if (!cfg.apiKey || cfg.apiKey.startsWith('ISI')) return;
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, addDoc, collection, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    await addDoc(collection(getFirestore(initializeApp(cfg)), 'wishes'),
      { name: nm.slice(0, 24), wish: ws.slice(0, 120), layout: lay, outlet: $('ol').value, ts: serverTimestamp() });
  } catch (e) { console.warn(e); }
}

// ---------- Start ----------
(async () => {
  setLay('cream');
  await Promise.all([document.fonts.load('700 32px Fredoka'), document.fonts.load('italic 500 26px "DM Sans"')]).catch(() => {});
  const [c, o] = await Promise.all([loadImg(FRAMES.cream.src), loadImg(FRAMES.orange.src)]);
  FI = { cream: c, orange: o };
  draw();
})();
</script></body></html>
